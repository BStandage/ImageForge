# First end-to-end run on the 8 GB card against the Imagenette sample from
# scripts/fetch_sample_dataset.py. Small on purpose: 2 images per class, 512px, 12 steps.
#
#   python scripts/fetch_sample_dataset.py data/sample --classes 3 --per-class 12
#   imageforge run --config configs/sample_local.yaml

ground_truth: ../data/sample
output: ../runs/sample
total_images: 6
seed: 0

caption:
  model: qwen2vl
  quantization: nf4
  max_images_per_class: 6

prompt:
  template: "A photo of a {class_name}. {caption}"

backend:
  name: flux
  model_id: black-forest-labs/FLUX.1-dev
  redux_model_id: black-forest-labs/FLUX.1-Redux-dev
  use_reference: true
  reference_strength: 0.35
  width: 512
  height: 512
  steps: 12
  guidance: 3.5
  dtype: bf16
  transformer_gguf: https://huggingface.co/city96/FLUX.1-dev-gguf/blob/main/flux1-dev-Q4_K_S.gguf
  quantization: nf4
  offload: group
  batch_size: 1

filter:
  enabled: true
  min_similarity: 0.55
